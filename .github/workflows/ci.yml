# SPDX-License-Identifier: GPL-3.0-or-later
name: FORDLink CI
on:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Portable C11 core
    runs-on: [self-hosted, Linux, X64, linux-native]
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Verify exact Link pin
        shell: bash
        run: |
          set -euo pipefail
          link_sha="$(git rev-parse HEAD:src/link)"
          test "$link_sha" = "$(git -C src/link rev-parse HEAD)"
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          grep -Fq "#define LINK_VERSION_STRING \"$link_version\"" src/link/include/link/version.h
      - name: Verify Link ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e include/fordlink/diagnostics.h
          test ! -e include/fordlink/obd2.h
          test ! -e tests/test_generic_diagnostics.c
          test ! -e tests/test_obd2.c
          test ! -e src/obd2/obd2.c
          test ! -e src/uds/uds.c
          test ! -e platform/apple/FordLinkBLETransport.m
          test ! -e platform/apple/FordLinkBLETransport.h
          test ! -e platform/apple/FordLinkBLETransport+FORDLink.h
          ! grep -Fq 'mercedes_me_' src/fordlink.c
          grep -Fq 'LinkPortableCore.c' src/fordlink.c
          grep -Fq 'LinkPortableObd2.c' app/ios/FORDLINK.xcodeproj/project.pbxproj
          grep -Fq 'LinkPortableUds.c' app/ios/FORDLINK.xcodeproj/project.pbxproj
          ! grep -Fq 'LINK_ENABLE_MERCEDES_ME_NATIVE=0' app/ios/FORDLINK.xcodeproj/project.pbxproj
          grep -Fq 'LINK_ENABLE_MERCEDES_ME_NATIVE=1' app/ios/FORDLINK.xcodeproj/project.pbxproj
          grep -Fq 'link_fault_scan_presentation_state' app/linux/main.c
          grep -Fq 'faultScanPresentationStateName' app/ios/FORDLINK/ConnectionViewModel.swift
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

      - name: Seal qualified core candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          out="$RUNNER_TEMP/qualified-core"
          source_root=$(mktemp -d)
          staging="$source_root/FORDLink-$version"
          trap 'rm -rf "$source_root"' EXIT
          mkdir -p "$out" "$staging"
          git archive HEAD | tar -x -C "$staging"
          export ARCHIVE_ROOT="$staging"
          git submodule foreach --recursive 'mkdir -p "$ARCHIVE_ROOT/$displaypath"; git archive HEAD | tar -x -C "$ARCHIVE_ROOT/$displaypath"'
          (cd "$source_root" && zip -qry "$out/FORDLink-$version-source.zip" "FORDLink-$version")
          unzip -tq "$out/FORDLink-$version-source.zip"
          
          printf '%s\n' "$GITHUB_SHA" > "$out/SOURCE_COMMIT-core"
          (cd "$out" && sha256sum FORDLink-* > SHA256SUMS-core)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-core
          path: ${{ runner.temp }}/qualified-core/*
          if-no-files-found: error
          retention-days: 30

  linux-gui:
    name: Linux GTK4 GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config xvfb
        if: runner.environment == 'github-hosted'
      - name: Bootstrap libusb development files for self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if pkg-config --exists libusb-1.0; then
            exit 0
          fi
          root="$RUNNER_TEMP/libusb-dev"
          dl="$RUNNER_TEMP/libusb-download"
          rm -rf "$root" "$dl"
          mkdir -p "$root" "$dl"
          cd "$dl"
          apt-get download libusb-1.0-0 libusb-1.0-0-dev
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root"
          done
          pc="$(find "$root/usr/lib" -path '*/pkgconfig/libusb-1.0.pc' -print -quit)"
          test -n "$pc"
          sed -i "s|^prefix=/usr$|prefix=$root/usr|" "$pc"
          libdir="$(dirname "$(dirname "$pc")")"
          echo "PKG_CONFIG_PATH=$(dirname "$pc")${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Bootstrap Xvfb for self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1 && command -v Xvfb >/dev/null 2>&1; then
            exit 0
          fi
          root="$RUNNER_TEMP/xvfb-root"
          dl="$RUNNER_TEMP/xvfb-download"
          rm -rf "$root" "$dl"
          mkdir -p "$root" "$dl"
          cd "$dl"
          apt-get download xvfb xserver-common xauth libxfont2
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root"
          done
          test -x "$root/usr/bin/xvfb-run"
          test -x "$root/usr/bin/Xvfb"
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          libdir="$root/usr/lib/x86_64-linux-gnu"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DFORDLINK_BUILD_LINUX_GUI=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Prove GUI launches and navigation is live
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/navigation.log"
          GTK_A11Y=none G_DEBUG=fatal-warnings timeout 45s xvfb-run -a ./build-linux/fordlink --ui-navigation-stress | tee "$log"
          grep -Fq 'Link GTK timed navigation stress verified:' "$log"
          grep -Fq 'FORDLink is GUI-first' app/linux/main.c
          grep -Fq 'LinkTaskTile(.vehicle)' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.errors)' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.table)' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.graph)' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.tests)' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.services)' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkDiagnosticAboutButton' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'LinkDiagnosticAboutView' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'descriptor.about = &about_info;' app/linux/main.c
          grep -Fq 'link_gtk_show_about' src/link/platform/linux/link-gtk-about.c
          ! grep -Fq 'LinkHomeTile("OBD"' app/ios/FORDLINK/ContentView.swift
          grep -Fq 'return self.shared.standardLiveValueRows;' platform/apple/FordLinkDiagnosticsController.m
          if grep -Eq '\.link-(connection-bar|device-row|adapter-combo|toolbar-button|link-button|save-session-button|card|status-chip)[^{]*\{[^}]*((min|max)-(width|height)|padding|border-radius)' app/linux/main.c; then
            echo 'Shared Linux shell geometry must come from Link, not FORDLink CSS.' >&2
            exit 1
          fi
          if grep -Fq 'adapter_combo_width' app/linux/main.c src/link/platform/linux/link-gtk-shell.h; then
            echo 'Adapter-selector width must be Link-owned.' >&2
            exit 1
          fi
          grep -Fq 'gtk_widget_set_hexpand(shell->device_combo, TRUE);' src/link/platform/linux/link-gtk-shell.c
      - name: Verify Debian GUI payload
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -c "$deb" | grep -F './usr/bin/fordlink' >/dev/null
          dpkg-deb -c "$deb" | grep -F './usr/share/applications/fordlink.desktop' >/dev/null
          dpkg-deb -c "$deb" | grep -F './usr/lib/udev/rules.d/60-fordlink-openport2.rules' >/dev/null

      - name: Verify native Linux source build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DFORDLINK_BUILD_LINUX_GUI=ON -DFORDLINK_BUILD_PROFILE=native -DBUILD_TESTING=OFF
          cmake --build build-native --parallel
          rm -rf native-stage
          DESTDIR="$PWD/native-stage" cmake --install build-native
          test -x native-stage/usr/bin/fordlink

      - name: Seal qualified linux candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          out="$RUNNER_TEMP/qualified-linux"
          mkdir -p "$out"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/cpack/"*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Package)" = fordlink
          test "$(dpkg-deb -f "${packages[0]}" Version)" = "$version"
          install -m 0644 "${packages[0]}" "$out/FORDLink-$version-linux-amd64.deb"
          
          printf '%s\n' "$GITHUB_SHA" > "$out/SOURCE_COMMIT-linux"
          (cd "$out" && sha256sum FORDLink-* > SHA256SUMS-linux)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-linux
          path: ${{ runner.temp }}/qualified-linux/*
          if-no-files-found: error
          retention-days: 30

  windows-gui:
    name: Windows Discover GUI
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PSExecutionPolicyPreference: RemoteSigned
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Configure
        shell: powershell
        run: cmake -S . -B build-win32 -A Win32 -DFORDLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - name: Build
        shell: powershell
        run: cmake --build build-win32 --config Release --target fordlink-discover --parallel
      - name: Prove GUI launches
        shell: powershell
        run: "& 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/fordlink-discover.exe' -ExpectedTitle 'FORDLink Discover'"

      - name: Seal qualified windows candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $out = Join-Path $env:RUNNER_TEMP 'qualified-windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          $name = "FORDLink-$version-windows-discover.exe"
          Copy-Item 'build-win32/Release/fordlink-discover.exe' (Join-Path $out $name)
          $hash = (Get-FileHash (Join-Path $out $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $out 'SHA256SUMS-windows') -Encoding ascii -NoNewline
          $env:GITHUB_SHA | Set-Content (Join-Path $out 'SOURCE_COMMIT-windows') -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-windows
          path: ${{ runner.temp }}/qualified-windows/*
          if-no-files-found: error
          retention-days: 30

  iphone-gui:
    name: iPhone SwiftUI GUI
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Build iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          project_versions="$(grep -E '^[[:space:]]*MARKETING_VERSION = ' app/ios/FORDLINK.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/' | sort -u)"
          test "$project_versions" = "$version"
          xcodebuild -project app/ios/FORDLINK.xcodeproj -scheme FORDLINK -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" FORDLINK_SOURCE_REVISION="$GITHUB_SHA" LINK_SOURCE_REVISION="$(git -C src/link rev-parse HEAD)" build

      - name: Seal qualified iphone candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          out="$RUNNER_TEMP/qualified-iphone"
          mkdir -p "$out"
          bash scripts/build-ios-ipa.sh "$RUNNER_TEMP/iphone-build"
          cp "$RUNNER_TEMP/iphone-build/FORDLink-$version-unsigned.ipa" "$out/"
          printf '%s\n' "$GITHUB_SHA" > "$out/SOURCE_COMMIT-iphone"
          (cd "$out" && shasum -a 256 FORDLink-* > SHA256SUMS-iphone)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-iphone
          path: ${{ runner.temp }}/qualified-iphone/*
          if-no-files-found: error
          retention-days: 30
